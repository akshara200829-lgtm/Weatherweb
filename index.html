<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <title>My weather application</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form id="search-form" class="search-form">
          <label class="field-label" for="search-input">Location</label>
          <div class="search-row">
            <input
              type="search"
              placeholder="Enter a city.."
              required
              class="search-input"
              id="search-input"
              autocomplete="off"
            />
            <button type="submit" class="search-button">Search</button>
          </div>
        </form>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
          <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </header>

      <main>
        <section class="current-weather" aria-live="polite">
          <div class="reading-primary">
            <p class="reading-eyebrow" id="current-date">Thursday 21:11</p>
            <h1 class="current-city" id="current-city">Paris</h1>
            <p class="current-description" id="current-description">moderate rain</p>
            <p class="status-message" id="status-message"></p>
          </div>

          <div class="reading-temperature">
            <div class="temp-top">
              <span class="current-temperature-icon" id="current-icon">☀️</span>
              <div class="temp-value-row">
                <span class="current-temperature-value" id="current-temperature">24</span>
                <span class="current-temperature-unit">°C</span>
              </div>
            </div>
            <div class="reading-gauge" aria-hidden="true"></div>
          </div>
        </section>

        <section class="stat-row">
          <div class="stat-block">
            <span class="stat-label">Humidity</span>
            <span class="stat-value" id="current-humidity">87%</span>
          </div>
          <div class="stat-divider" aria-hidden="true"></div>
          <div class="stat-block">
            <span class="stat-label">Wind</span>
            <span class="stat-value" id="current-wind">7.2km/h</span>
          </div>
        </section>
      </main>

      <footer>
        <p>
          This project was coded by
          <a href="https://github.com/akshara200829-lgtm" target="_blank" rel="noreferrer">Akshara S Kumar</a>
          and is
          <a href="https://github.com/akshara200829-lgtm/Weatherweb" target="_blank" rel="noreferrer">on GitHub</a> and
          <a href="#" target="_blank" rel="noreferrer">hosted on Netlify</a>.
        </p>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
